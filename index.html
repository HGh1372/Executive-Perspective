    :root {
      --font-fa: 'Vazirmatn', -apple-system, sans-serif;
      --font-en: 'Plus Jakarta Sans', -apple-system, sans-serif;
      --transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }

    [data-theme="dark"] {
      --bg-base: #040609; --bg-surface: #0b111a; --bg-card: #0d141e;
      --bg-result: rgba(14, 165, 233, 0.08); --border-subtle: rgba(255, 255, 255, 0.05);
      --border-accent: rgba(56, 189, 248, 0.4); --text-main: #f8fafc;
      --text-muted: #a1a1aa; --text-dim: #64748b; --primary: #0ea5e9;
      --primary-light: #38bdf8; --accent: #8b5cf6; --success: #10b981;
      --warning: #f59e0b; --danger: #ef4444; --shadow: 0 16px 40px rgba(0,0,0,0.5);
    }

    [data-theme="light"] {
      --bg-base: #f4f7fa; --bg-surface: #ffffff; --bg-card: #ffffff;
      --bg-result: rgba(2, 132, 199, 0.05); --border-subtle: rgba(0, 0, 0, 0.1);
      --border-accent: rgba(37, 99, 235, 0.3); --text-main: #0f172a;
      --text-muted: #475569; --text-dim: #94a3b8; --primary: #0284c7;
      --primary-light: #0ea5e9; --accent: #6d28d9; --success: #059669;
      --warning: #d97706; --danger: #dc2626; --shadow: 0 16px 40px rgba(0,0,0,0.06);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; scroll-behavior: smooth; }
    body { background-color: var(--bg-base); color: var(--text-main); font-family: var(--font-fa); line-height: 1.8; transition: background-color 0.4s, color 0.4s; overflow-x: hidden; }
    body[dir="ltr"] { font-family: var(--font-en); }

    /* Tooltip Styles */
    .tooltip { position: relative; border-bottom: 1px dotted var(--primary-light); cursor: help; color: inherit; font-weight: 700; transition: var(--transition); }
    .tooltip:hover { color: var(--primary-light); }
    .tooltip::after {
      content: attr(data-tooltip); position: absolute; bottom: 130%; left: 50%; transform: translateX(-50%) translateY(5px);
      background: var(--bg-surface); color: var(--text-main); padding: 0.4rem 0.8rem; border-radius: 6px;
      font-size: 0.75rem; white-space: nowrap; opacity: 0; visibility: hidden; transition: var(--transition);
      border: 1px solid var(--border-accent); box-shadow: 0 4px 15px rgba(0,0,0,0.2); z-index: 1000;
    }
    .tooltip:hover::after { opacity: 1; visibility: visible; transform: translateX(-50%) translateY(0); }

    /* Header */
    header { position: sticky; top: 0; z-index: 1000; background: var(--bg-surface); border-bottom: 1px solid var(--border-subtle); padding: 1rem 4%; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 4px 20px rgba(0,0,0,0.2); }
    .brand { font-weight: 800; font-size: 1.2rem; display: flex; align-items: center; gap: 0.5rem; }
    .brand span { color: var(--primary); }
    .controls { display: flex; gap: 1rem; align-items: center; }
    .btn { background: var(--bg-card); border: 1px solid var(--border-subtle); color: var(--text-main); padding: 0.4rem 1.2rem; border-radius: 20px; font-weight: 700; font-size: 0.8rem; cursor: pointer; transition: var(--transition); font-family: inherit; }
    .btn:hover { background: var(--primary); color: #fff; border-color: var(--primary); }



    /* Core Container */
    .container { max-width: 1400px; margin: 0 auto; padding: 3rem 4%; display: flex; flex-direction: column; gap: 5rem; transition: var(--transition); border-radius: 16px;}
    .sec-head { margin-bottom: 2.5rem; }
    .sec-head h2 { font-size: 2rem; font-weight: 800; display: flex; align-items: center; gap: 0.75rem; margin-bottom: 1rem; color: var(--primary-light); }
    .sec-head h2::before { content: ''; width: 6px; height: 2rem; background: var(--primary); border-radius: 4px; }
    .sec-head p { font-size: 1.05rem; color: var(--text-muted); max-width: 1100px; line-height: 1.8; text-align: justify; }

    /* Grids & Refined Cards (Based on Image Reference) */
    .grid-2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(450px, 1fr)); gap: 2rem; }
    .grid-3 { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 2rem; }
    
    .card { 
      background: var(--bg-card); border: 1px solid #1e3a5f; border-radius: 12px; 
      padding: 2rem; transition: var(--transition); display: flex; flex-direction: column; 
      height: 100%; position: relative;
    }
    .card:hover { border-color: var(--primary-light); box-shadow: 0 0 20px rgba(56, 189, 248, 0.05); transform: translateY(-3px); }
    
    .card-tag-wrapper { display: flex; justify-content: flex-end; margin-bottom: 1.5rem; }
    body[dir="ltr"] .card-tag-wrapper { justify-content: flex-end; }
    .card-tag { 
      display: inline-block; padding: 0.3rem 0.8rem; background: transparent; 
      color: var(--primary-light); font-weight: 700; font-size: 0.85rem; 
      border-radius: 6px; border: 1px solid #1e3a5f;
    }
    
    .en-title { display: block; text-align: right; font-size: 1.4rem; font-weight: 800; margin-bottom: 1.25rem; color: var(--primary-light); }
    body[dir="ltr"] .en-title { text-align: left; }
    
    .card-desc { font-size: 0.95rem; color: var(--text-muted); margin-bottom: 2rem; text-align: justify; line-height: 1.8; flex-grow: 1; }
    
    .card-list { display: flex; flex-direction: column; gap: 1rem; border-top: 1px dashed #1e3a5f; padding-top: 1.5rem; }
    .card-list-item { font-size: 0.9rem; color: var(--text-muted); display: flex; gap: 0.5rem; align-items: baseline; line-height: 1.7; }
    .card-list-item .diamond { color: var(--primary-light); font-size: 0.8rem; margin-top: 2px;}
    .lbl-bold { font-weight: 800; color: #ffffff; white-space: nowrap; }
    
    .doc-ref { background: rgba(139, 92, 246, 0.15); color: var(--accent); padding: 0.1rem 0.4rem; border-radius: 4px; font-weight: 700; border: 1px solid rgba(139, 92, 246, 0.3); font-size: 0.85rem; margin: 0 0.2rem; display: inline-block; direction: ltr; }

    /* Tables */
    .table-wrapper { overflow-x: auto; background: var(--bg-surface); border: 1px solid var(--border-subtle); border-radius: 16px; }
    table { width: 100%; border-collapse: collapse; text-align: inherit; }
    th { padding: 1.2rem; background: rgba(0,0,0,0.1); color: var(--text-dim); font-size: 0.9rem; font-weight: 800; border-bottom: 1px solid var(--border-subtle); }
    td { padding: 1.2rem; font-size: 0.95rem; color: var(--text-muted); border-bottom: 1px solid var(--border-subtle); }
    tr:hover td { background: var(--bg-result); color: var(--text-main); }

    /* Simulators */
    .sim-container { display: grid; grid-template-columns: repeat(auto-fit, minmax(500px, 1fr)); gap: 2.5rem; }
    .simulator { background: var(--bg-surface); border: 1px solid var(--border-subtle); border-radius: 20px; overflow: hidden; display: flex; flex-direction: column; box-shadow: 0 4px 20px rgba(0,0,0,0.15); }
    .sim-top-card { padding: 2rem; text-align: center; border-bottom: 1px solid var(--border-subtle); transition: var(--transition); display: flex; flex-direction: column; align-items: center; gap: 0.75rem; }
    .res-title { font-size: 0.85rem; font-weight: 800; color: var(--text-dim); text-transform: uppercase; letter-spacing: 1px; }
    
    /* RTL fixed for score */
    .res-score { display: flex; align-items: baseline; justify-content: center; gap: 0.5rem; }
    .res-score .num { font-size: 3rem; font-weight: 800; line-height: 1.2; direction: ltr; display: inline-block; }
    .res-score .unit { font-size: 1.2rem; font-weight: 600; color: var(--text-dim); }
    
    .res-verdict { font-size: 1.1rem; font-weight: 800; padding: 0.6rem 1.5rem; border-radius: 12px; transition: all 0.3s; width: 100%; max-width: 400px; text-align: center; }
    
    /* Sim Controls & Logic Panel */
    .sim-controls { padding: 2rem; display: flex; flex-direction: column; gap: 1.5rem; }
    .sim-header-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.5rem; }
    .sim-controls h4 { font-size: 1.2rem; font-weight: 800; color: var(--primary-light); }
    
    /* Logic Panel (Visible by default) */
    .sim-logic { display: block; background: rgba(255,255,255,0.03); padding: 1.25rem; border-radius: 12px; border-right: 3px solid var(--primary); margin-bottom: 1rem; font-size: 0.85rem; color: var(--text-muted); line-height: 1.8; text-align: justify;}
    body[dir="ltr"] .sim-logic { border-right: none; border-left: 3px solid var(--primary); }
    [data-theme="light"] .sim-logic { background: rgba(0,0,0,0.03); }
    .logic-title { color: var(--text-main); font-weight: 800; margin-bottom: 0.5rem; font-size: 0.95rem; display: flex; align-items: center; gap: 0.4rem;}
    .logic-link { color: var(--accent); text-decoration: none; font-weight: 700; }
    .logic-link:hover { text-decoration: underline; }

    /* Sliders */
    .slider-group { display: flex; flex-direction: column; gap: 0.5rem; }
    .slider-labels { display: flex; justify-content: space-between; font-size: 0.85rem; font-weight: 700; color: var(--text-muted); }
    .slider-labels span.val { color: var(--primary-light); font-weight: 800; font-size: 1.05rem; direction: ltr; display: inline-block; }
    input[type=range] { width: 100%; accent-color: var(--primary); cursor: pointer; height: 6px; }

    /* Chart Layout */
    .chart-layout { background: var(--bg-surface); border: 1px solid var(--border-subtle); border-radius: 20px; display: grid; grid-template-columns: 1fr 2fr; gap: 0; overflow: hidden; }
    .chart-controls { padding: 2rem; border-left: 1px solid var(--border-subtle); background: var(--bg-card); display: flex; flex-direction: column; gap: 1.5rem; }
    body[dir="ltr"] .chart-controls { border-left: none; border-right: 1px solid var(--border-subtle); }
    .chart-canvas-wrap { padding: 2rem; position: relative; min-height: 450px; }
    
    /* Specific Colors */
    .bg-safe { background: rgba(16,185,129,0.1); border-color: rgba(16,185,129,0.3); color: var(--success); }
    .text-safe { color: var(--success); }
    .bg-warn { background: rgba(245,158,11,0.1); border-color: rgba(245,158,11,0.3); color: var(--warning); }
    .text-warn { color: var(--warning); }
    .bg-danger { background: rgba(239,68,68,0.1); border-color: rgba(239,68,68,0.3); color: var(--danger); }
    .text-danger { color: var(--danger); }
    .bg-primary { background: rgba(59,130,246,0.1); border-color: rgba(59,130,246,0.3); color: var(--primary-light); }
    .text-accent { color: var(--accent); }
    .bg-accent { background: rgba(139,92,246,0.1); border-color: rgba(139,92,246,0.3); color: var(--accent); }

    /* Summary Card */
    .summary-card { background: linear-gradient(135deg, rgba(14,165,233,0.1), rgba(139,92,246,0.05)); border: 1px solid var(--border-accent); border-radius: 16px; padding: 3rem; text-align: right; box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
    body[dir="ltr"] .summary-card { text-align: left; }
    .summary-card h3 { font-size: 1.8rem; font-weight: 800; color: var(--primary-light); margin-bottom: 1.5rem; text-align: center; border-bottom: 1px solid rgba(14,165,233,0.2); padding-bottom: 1rem; }
    .manifesto-block { font-size:1.05rem; font-weight:500; color:var(--text-main); line-height:1.9; text-align: justify; }
    .manifesto-block strong { color:var(--primary-light); font-weight:800; }
    
    @media (max-width: 1024px) { .chart-layout { grid-template-columns: 1fr; } .chart-controls { border-left: none; border-bottom: 1px solid var(--border-subtle); } body[dir="ltr"] .chart-controls { border-right: none; } }
    @media (max-width: 768px) { .grid-2, .grid-3, .sim-container { grid-template-columns: 1fr; } .res-score .num { font-size: 2.2rem; } }

}

 display:grid; grid-template-columns:auto minmax(0,1fr) auto; align-items:center;
 gap:1.15rem; padding:.65rem 3%; position:sticky; top:0; z-index:1000;
 background:var(--bg-surface); border-bottom:1px solid var(--border-subtle);

.mkt-fallback-table caption { font-size:.7rem; color:var(--text-muted); text-align:start; padding:.5rem; }
.mkt-fallback-table th,.mkt-fallback-table td { padding:.5rem; font-size:.7rem; }
.heat-content { padding:1.4rem; min-width:0; }
.heat-heading h3 { font-size:1.12rem; }
.heat-heading p { font-size:.82rem; }

.heat-cost-field { margin:1rem 0; }

.heat-axis-title { text-align:center; margin:.85rem 0 .4rem; color:var(--text-main); font-size:.72rem; font-weight:700; }
.heat-grid { display:grid; grid-template-columns:43px repeat(5,minmax(0,1fr)); gap:5px; direction:ltr; width:100%; }
.heat-corner,.heat-col-heading,.heat-row-heading { display:flex; align-items:center; justify-content:center; min-width:0; color:var(--text-muted); font-size:.66rem; font-weight:650; }
.heat-col-heading { min-height:25px; }
.heat-corner { direction:inherit; }
.heat-cell { position:relative; min-width:0; min-height:49px; padding:.25rem .1rem; border:1px solid var(--border-subtle); border-radius:8px; background:var(--heat-cell-fill); color:var(--text-main); font-size:.82rem; font-weight:750; line-height:1.45; cursor:pointer; }
.heat-cell bdi { display:block; }
.heat-cell small { display:block; font-size:.54rem; font-weight:500; color:var(--text-muted); }
.heat-cell:hover { box-shadow:inset 0 0 0 1px var(--primary-light); }
.heat-cell.is-selected { outline:2px solid var(--primary-light); outline-offset:1px; z-index:1; }
.heat-cell.is-baseline { border-style:dashed; }
.heat-legend { display:flex; justify-content:center; gap:1rem; flex-wrap:wrap; margin:.7rem 0 .4rem; color:var(--text-muted); font-size:.6rem; }
.heat-legend span { display:inline-flex; align-items:center; gap:.3rem; }
.heat-legend i { width:9px; height:9px; border-radius:3px; display:inline-block; }
.heat-legend-loss { background:rgba(239,68,68,.65); }
.heat-legend-neutral { background:rgba(148,163,184,.45); }
.heat-legend-gain { background:rgba(16,185,129,.65); }
.heat-instruction { color:var(--text-muted); font-size:.65rem; line-height:1.8; margin-bottom:.9rem; }
.heat-selected { border:1px solid var(--border-subtle); border-radius:12px; padding:.85rem; background:var(--bg-card); }
.heat-result-label { display:block; color:var(--text-muted); font-size:.69rem; }

.heat-profit-row strong small { font-size:.62rem; color:var(--text-muted); font-weight:500; }

.heat-profit-change.is-negative { color:var(--danger); background:rgba(239,68,68,.09); }
.heat-profit-change.is-positive { color:var(--success); background:rgba(16,185,129,.09); }
.heat-baseline-profit { color:var(--text-muted); font-size:.64rem; line-height:1.8; }

.heat-insight { margin-top:.8rem; font-size:.74rem; padding:.7rem .8rem; }
.heat-insight p+p { margin-top:.4rem; color:var(--text-muted); font-size:.67rem; }
.heat-bottom { display:flex; gap:.8rem; align-items:flex-start; justify-content:space-between; margin-top:.7rem; }
.heat-bottom .mkt-assumptions { margin-top:0; flex:1; }
.heat-bottom .mkt-reset { font-size:.65rem; }
@media(max-width:900px) {
  .mkt-model-layout { grid-template-columns:1fr; gap:1.2rem; }

}
@media(max-width:600px) {

  .mkt-module-heading p { font-size:.8rem; }
  .mkt-baseline { font-size:.7rem; }

  .mkt-insight { padding:.7rem .8rem; font-size:.76rem; }

  .heat-cell { min-height:46px; font-size:.71rem; border-radius:6px; }
  .heat-col-heading,.heat-row-heading,.heat-corner { font-size:.61rem; }
  .heat-legend { gap:.65rem; }

@media(prefers-reduced-motion:reduce) { .mkt-intelligence *,.heat-scenario * { transition:none!important; animation:none!important; } }

    // --- Simulator Logic ---
    function execNumber(value, decimals=0) {
      return new Intl.NumberFormat(lang==='fa'?'fa-IR':'en-US',{maximumFractionDigits:decimals}).format(Number(value));
    }
    function execPercent(value) { return execNumber(value,1)+(lang==='fa'?'٪':'%'); }

    function calcBD() {
      const v1 = parseFloat(document.getElementById('s_bd1').value);
      const v2 = parseFloat(document.getElementById('s_bd2').value);
      const v3 = parseFloat(document.getElementById('s_bd3').value);
      document.getElementById('v_bd1').textContent = execNumber(v1);
      document.getElementById('v_bd2').textContent = execNumber(v2);
      document.getElementById('v_bd3').textContent = execNumber(v3);

      const score = ((v1 * 0.4) + (v2 * 0.3) + (v3 * 0.3)).toFixed(1);
      const decEl = document.getElementById('dec_bd');
      const cardEl = document.getElementById('card_bd');
      
      document.getElementById('val_bd').innerHTML = `<span class="num">${execNumber(score,1)}</span> <span class="unit">${lang==='fa'?'از ۱۰':'out of 10'}</span>`;
      
      if (score >= 7.5) { decEl.textContent = dict[lang].bd_pass; decEl.className = "res-verdict bg-safe"; document.getElementById('val_bd').className = "res-score text-safe"; cardEl.style.backgroundColor = "rgba(16,185,129,0.08)"; }
      else if (score >= 6.0) { decEl.textContent = dict[lang].bd_warn; decEl.className = "res-verdict bg-warn"; document.getElementById('val_bd').className = "res-score text-warn"; cardEl.style.backgroundColor = "rgba(245,158,11,0.08)"; }
      else { decEl.textContent = dict[lang].bd_fail; decEl.className = "res-verdict bg-danger"; document.getElementById('val_bd').className = "res-score text-danger"; cardEl.style.backgroundColor = "rgba(239,68,68,0.08)"; }
    }

    function calcPSP() {
      const pop = parseInt(document.getElementById('s_psp1').value);
      const drop = parseInt(document.getElementById('s_psp2').value) / 100;
      const eff = parseInt(document.getElementById('s_psp3').value) / 100;
      document.getElementById('v_psp1').textContent = execNumber(pop);
      document.getElementById('v_psp2').textContent = execPercent(drop * 100);
      document.getElementById('v_psp3').textContent = execPercent(eff * 100);

      const saved = Math.round(pop * drop * eff);
      // Illustrative gross value per course: 15 million tomans, before costs.
      const valueBillion = (saved * 15) / 1000; 

      document.getElementById('val_psp_num').textContent = execNumber(valueBillion,2);
      document.getElementById('dec_psp').textContent = dict[lang].psp_save.replace('{n}', execNumber(saved));
    }

    function calcPV() {
      const delay = parseInt(document.getElementById('s_pv1').value);
      const capa = parseInt(document.getElementById('s_pv2').value);
      document.getElementById('v_pv1').textContent = execNumber(delay);
      document.getElementById('v_pv2').textContent = execNumber(capa);

      // Scenario weights only: not statutory fines or validated risk coefficients.
      const fineMillions = (delay * 50) + (capa * 200); 
      const fineBillions = fineMillions / 1000;
      
      const num = document.getElementById('val_pv_num');
      const unit = document.getElementById('val_pv_unit');
      const dec = document.getElementById('dec_pv');
      const card = document.getElementById('card_pv');

      if (fineMillions === 0) {
        num.textContent = execNumber(0); unit.style.display = "none"; document.getElementById('val_pv').className = "res-score text-safe";
        dec.textContent = dict[lang].pv_safe; dec.className = "res-verdict bg-safe";
        card.style.backgroundColor = "rgba(16,185,129,0.08)";
      } else {
        num.textContent = execNumber(fineBillions,2); unit.style.display = "inline-block"; document.getElementById('val_pv').className = "res-score text-danger";
        dec.textContent = dict[lang].pv_crit; dec.className = "res-verdict bg-danger";
        card.style.backgroundColor = "rgba(239,68,68,0.08)";
      }
    }

function okrQueueLiveRefresh() {

}
function okrFitMap() {

function okrSelectNode(id) {

function initOkrSection() {
  const scope=document.getElementById('sales-okr');if(!scope)return;
  if(okrState.resizeObserver)okrState.resizeObserver.disconnect();
  if(okrState.refreshFrame!==null)cancelAnimationFrame(okrState.refreshFrame);
  if(okrState.fitFrame!==null)cancelAnimationFrame(okrState.fitFrame);
  okrState.refreshFrame=null;okrState.fitFrame=null;
  scope.addEventListener('input',event=>{
    if(event.target.id==='okr-target-input') {
      const raw=event.target.value.trim(), next=Number(raw);
      if(raw!==''&&Number.isInteger(next)&&next>=100&&next<=180){okrState.target=next;okrQueueLiveRefresh();}
      okrSyncPlanner();

      okrState.shares=okrRedistributeShare(Number(event.target.dataset.okrShare),Number(event.target.value));

    }
  });

    const nodeButton=event.target.closest('[data-okr-node]');if(nodeButton){okrSelectNode(nodeButton.dataset.okrNode);return;}

    if(action==='reset'){okrState.target=120;okrState.shares=[40,35,25];document.getElementById('okr-target-input').value=120;okrSyncPlanner();okrRefresh(false);}
    if(action==='tree'){okrFitMap();}
    if(action==='table'){okrState.view='table';okrRefresh(false);}
    if(action==='focus'){okrState.focused=!okrState.focused;okrState.view='tree';okrRefresh(true);okrFitMap();}
    if(action==='fit')okrFitMap();
    if((action==='zoom-in'||action==='zoom-out')&&okrState.svg&&okrState.zoom){okrState.userTransformVersion++;okrState.svg.call(okrState.zoom.scaleBy,action==='zoom-in'?1.2:1/1.2);}
  });
  okrRefresh(true);okrSyncPlanner();
  const initialTransformVersion=okrState.userTransformVersion;
  if(document.fonts&&document.fonts.status!=='loaded')document.fonts.ready.then(()=>{if(scope.isConnected&&okrState.view==='tree'&&okrState.userTransformVersion===initialTransformVersion)okrFitMap();});
  if(typeof ResizeObserver!=='undefined'){
    const canvas=document.getElementById('okr-canvas');let previousWidth=canvas.clientWidth;
    okrState.resizeObserver=new ResizeObserver(entries=>{const width=entries[0].contentRect.width;if(width>0&&Math.abs(width-previousWidth)>8){previousWidth=width;clearTimeout(okrState.resizeTimer);okrState.resizeTimer=setTimeout(()=>{if(scope.isConnected&&okrState.view==='tree')okrFitMap();},80);}});
    okrState.resizeObserver.observe(canvas);
  }
}

function mktCopy() { return marketScenarioCopy[lang === 'fa' ? 'fa' : 'en']; }
function mktEscape(value) { return String(value).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function mktNumber(value, digits=1) {
  const factor = 10 ** digits;
  const magnitude = Math.abs(value);
  const rounded = Math.sign(value) * Math.round((magnitude + Number.EPSILON * Math.max(1,magnitude) * 4) * factor) / factor;
  const clean = Math.abs(rounded)<.0000001 ? 0 : rounded;
  return new Intl.NumberFormat(lang==='fa'?'fa-IR':'en-US',{maximumFractionDigits:digits}).format(clean);
}
function mktSigned(value,digits=1) { return (value>0?'+':'')+mktNumber(value,digits); }
function mktPercent(value,signed=false,digits=1) { return (signed?mktSigned(value,digits):mktNumber(value,digits))+(lang==='fa'?'٪':'%'); }
function mktBdi(value) { return `<bdi dir="ltr">${mktEscape(value)}</bdi>`; }
function mktFill(text, values) { return text.replace(/\{(\w+)\}/g,(_,key)=>values[key]===undefined?'':values[key]); }
function mktScenarioValues() {
  const baselineMarket=1000, baselineShare=20, baselineSales=200;
  const market=baselineMarket*(1+marketScenarioState.growth/100);
  const share=baselineShare-marketScenarioState.loss+marketScenarioState.recapture;
  const sales=market*share/100, benchmark=market*baselineShare/100;
  return { baselineMarket,baselineShare,baselineSales,market,share,sales,benchmark,gap:sales-benchmark,shareChange:share-baselineShare,salesChange:(sales/baselineSales-1)*100 };
}
function mktSeries() {
  return [0,.25,.5,.75,1].map(fraction=>{
    const market=1000*(1+marketScenarioState.growth/100*fraction);
    const share=20+(marketScenarioState.recapture-marketScenarioState.loss)*fraction;
    return {company:market*share/100,benchmark:market*.2};
  });
}
function mktKpiMarkup() {
  const t=mktCopy(),n=mktScenarioValues();
  const cards=[
    [t.market,mktNumber(n.market),t.bn,mktFill(t.marketNote,{n:mktBdi(mktPercent(marketScenarioState.growth))}), ''],
    [t.share,mktPercent(n.share),'',mktFill(t.shareNote,{n:mktBdi(mktSigned(n.shareChange))}), n.shareChange<0?'mkt-negative':n.shareChange>0?'mkt-positive':''],
    [t.sales,mktNumber(n.sales),t.bn,mktFill(t.salesNote,{n:mktBdi(mktPercent(n.salesChange,true))}), ''],
    [t.gap,mktSigned(n.gap),t.bn,mktFill(t.gapNote,{n:mktBdi(mktNumber(n.benchmark))}), n.gap<0?'mkt-negative':n.gap>0?'mkt-positive':'']
  ];
  return cards.map(([label,value,unit,note,cl])=>`<div class="mkt-kpi ${cl}"><span>${label}</span><strong>${mktBdi(value)}${unit?`<small>${unit}</small>`:''}</strong><p>${note}</p></div>`).join('');

function mktInsightMarkup() {

    <div class="mkt-kpis" id="mkt-kpis">${mktKpiMarkup()}</div>
    <div class="mkt-model-layout"><div class="mkt-controls">
      <div class="mkt-field"><label for="mkt-growth">${t.growth}<output id="mkt-growth-value" for="mkt-growth">${mktBdi(mktPercent(marketScenarioState.growth))}</output></label><input id="mkt-growth" type="range" min="0" max="30" step="1" value="${marketScenarioState.growth}"><div class="mkt-range-scale" aria-hidden="true"><bdi>0%</bdi><bdi>30%</bdi></div></div>
      <div class="mkt-field"><label for="mkt-loss">${t.loss}<output id="mkt-loss-value" for="mkt-loss">${mktBdi(mktNumber(marketScenarioState.loss))} <small>${t.pp}</small></output></label><input id="mkt-loss" type="range" min="0" max="8" step="1" value="${marketScenarioState.loss}"><div class="mkt-range-scale" aria-hidden="true"><bdi>0</bdi><bdi>8</bdi></div></div>
      <div class="mkt-field"><label for="mkt-recapture">${t.recapture}<output id="mkt-recapture-value" for="mkt-recapture">${mktBdi(mktNumber(marketScenarioState.recapture))} <small>${t.pp}</small></output></label><input id="mkt-recapture" type="range" min="0" max="8" step="1" value="${marketScenarioState.recapture}"><div class="mkt-range-scale" aria-hidden="true"><bdi>0</bdi><bdi>8</bdi></div></div>
    </div><div class="mkt-chart-area"><h4>${t.chartTitle}</h4><p class="mkt-chart-subtitle">${t.chartSub}</p><div class="mkt-chart-wrap"><canvas id="mkt-chart" role="img" aria-label="${t.chartTitle}"></canvas></div><div id="mkt-chart-fallback" hidden></div><p class="mkt-chart-note">${t.chartNote}</p></div></div>
    <div class="mkt-insight" id="mkt-insight" role="status" aria-live="polite">${mktInsightMarkup()}</div>
    <details class="mkt-assumptions"><summary>${t.assumptions}</summary><ul><li>${t.formulaMarket}</li><li>${t.formulaShare}</li><li>${t.formulaRevenue}</li><li>${t.formulaGap}</li></ul><p>${t.modelNote}</p></details>
  </article>`;
}
function mktRenderChartFallback() {
  const t=mktCopy(),rows=mktSeries();
  const box=document.getElementById('mkt-chart-fallback');if(!box)return;
  box.innerHTML=`<div class="mkt-fallback-table"><table><caption>${t.fallback} · ${t.bn}</caption><thead><tr><th>${t.period}</th><th>${t.companyLine}</th><th>${t.benchmarkLine}</th></tr></thead><tbody>${rows.map((n,i)=>`<tr><th scope="row">${t.periods[i]}</th><td>${mktBdi(mktNumber(n.company,2))}</td><td>${mktBdi(mktNumber(n.benchmark,2))}</td></tr>`).join('')}</tbody></table></div>`;
}
function mktRenderChart() {
  const canvas=document.getElementById('mkt-chart');if(!canvas)return;
  if(typeof myChart!=='undefined'&&myChart)myChart.destroy();
  myChart=null;
  if(typeof Chart==='undefined') {
    canvas.parentElement.hidden=true;document.getElementById('mkt-chart-fallback').hidden=false;mktRenderChartFallback();return;
  }
  canvas.parentElement.hidden=false;document.getElementById('mkt-chart-fallback').hidden=true;
  const t=mktCopy(),rows=mktSeries(),color=theme==='dark'?'#a1b1c4':'#475569',font=lang==='fa'?'Vazirmatn':'Plus Jakarta Sans';
  myChart=new Chart(canvas.getContext('2d'),{
    type:'line',data:{labels:t.periods,datasets:[
      {label:t.companyLine,data:rows.map(n=>n.company),borderColor:'#0ea5e9',backgroundColor:'#0ea5e9',borderWidth:3,pointRadius:4,pointHoverRadius:6,tension:0,fill:false},
      {label:t.benchmarkLine,data:rows.map(n=>n.benchmark),borderColor:theme==='dark'?'#b9c7d8':'#64748b',backgroundColor:theme==='dark'?'#b9c7d8':'#64748b',borderDash:[6,5],borderWidth:2,pointRadius:3,pointHoverRadius:5,tension:0,fill:false}
    ]},options:{responsive:true,maintainAspectRatio:false,animation:{duration:window.matchMedia('(prefers-reduced-motion: reduce)').matches?0:220},interaction:{mode:'index',intersect:false},plugins:{
      legend:{position:'bottom',labels:{color,font:{family:font,size:11},boxWidth:18,padding:16,usePointStyle:true}},
      tooltip:{rtl:lang==='fa',titleFont:{family:font},bodyFont:{family:font},callbacks:{label:ctx=>`${ctx.dataset.label}: ${mktNumber(ctx.parsed.y,2)} ${t.bn}`}}
    },scales:{
      x:{grid:{display:false},ticks:{color,font:{family:font,size:11},maxRotation:0}},
      y:{beginAtZero:true,grid:{color:'rgba(160,180,200,.15)'},ticks:{color,font:{family:font,size:11},callback:value=>mktNumber(value,0)}}
    }}
  });
}
function updateMarketIntelligence() {
  const scope=document.getElementById('mkt-intelligence');if(!scope)return;
  const t=mktCopy();
  document.getElementById('mkt-kpis').innerHTML=mktKpiMarkup();
  document.getElementById('mkt-insight').innerHTML=mktInsightMarkup();
  document.getElementById('mkt-insight').dataset.direction=mktScenarioValues().shareChange<0?'loss':mktScenarioValues().shareChange>0?'gain':'flat';
  document.getElementById('mkt-growth-value').innerHTML=mktBdi(mktPercent(marketScenarioState.growth));
  ['loss','recapture'].forEach(key=>{document.getElementById('mkt-'+key+'-value').innerHTML=mktBdi(mktNumber(marketScenarioState[key]))+` <small>${t.pp}</small>`;});
  if(typeof myChart!=='undefined'&&myChart){const rows=mktSeries();myChart.data.datasets[0].data=rows.map(n=>n.company);myChart.data.datasets[1].data=rows.map(n=>n.benchmark);myChart.update();}else mktRenderChartFallback();
}
function heatScenarioValues(price=marketScenarioState.heatPrice,volume=marketScenarioState.heatVolume) {
  const unitPrice=1000000*(1+price/100),unitCost=1000000*marketScenarioState.heatCostRatio/100;
  const units=10000*(1+volume/100),unitMargin=unitPrice-unitCost;
  const baselineProfit=(1000000-unitCost)*10000/1e9,profit=unitMargin*units/1e9;
  const breakEvenUnits=baselineProfit*1e9/unitMargin;
  return {price,volume,unitPrice,unitCost,units,unitMargin,baselineProfit,profit,delta:(profit/baselineProfit-1)*100,netSales:unitPrice*units/1e9,breakEvenUnits,breakEvenVolume:(breakEvenUnits/10000-1)*100};
}
function heatCellMarkup(price,volume) {
  const t=mktCopy(),n=heatScenarioValues(price,volume),selected=price===marketScenarioState.heatPrice&&volume===marketScenarioState.heatVolume,base=price===0&&volume===0;
  const rgb=n.delta<-.00001?'239,68,68':n.delta>.00001?'16,185,129':'148,163,184';
  const alpha=.09+Math.min(1,Math.abs(n.delta)/45)*.3;
  const label=mktFill(t.cellLabel,{price:mktPercent(price,true),volume:mktPercent(volume,true),profit:mktNumber(n.profit,2),delta:mktPercent(n.delta,true)});
  return `<button type="button" class="heat-cell${selected?' is-selected':''}${base?' is-baseline':''}" data-heat-price="${price}" data-heat-volume="${volume}" aria-pressed="${selected}" aria-label="${mktEscape(label)}" title="${mktEscape(label)}" style="--heat-cell-fill:rgba(${rgb},${alpha.toFixed(3)})"><bdi dir="ltr">${mktPercent(n.delta,true)}</bdi>${base?`<small>${t.baselineCell}</small>`:''}</button>`;
}
function heatGridMarkup() {
  const t=mktCopy();
  return `<div class="heat-corner">${t.priceAxis}</div>${heatVolumeSteps.map(volume=>`<div class="heat-col-heading"><bdi dir="ltr">${mktPercent(volume,true)}</bdi></div>`).join('')}${heatPriceSteps.map(price=>`<div class="heat-row-heading"><bdi dir="ltr">${mktPercent(price,true)}</bdi></div>${heatVolumeSteps.map(volume=>heatCellMarkup(price,volume)).join('')}`).join('')}`;
}
function heatInsightMarkup() {
  const t=mktCopy(),n=heatScenarioValues();
  let insight;
  if(n.price<0&&n.volume>0&&n.delta<-.00001) insight=mktFill(t.discountInsight,{volume:mktBdi(mktPercent(n.volume)),price:mktBdi(mktPercent(-n.price)),delta:mktBdi(mktPercent(-n.delta))});
  else insight=n.delta<-.00001?mktFill(t.heatInsightLoss,{n:mktBdi(mktPercent(-n.delta))}):n.delta>.00001?mktFill(t.heatInsightGain,{n:mktBdi(mktPercent(n.delta))}):t.heatInsightFlat;
  return `<strong>${t.decision}</strong><p>${insight}</p><p>${mktFill(t.breakEven,{units:mktBdi(mktNumber(Math.ceil(n.breakEvenUnits),0)),change:mktBdi(mktPercent(n.breakEvenVolume,true))})}</p>`;
}
function heatSelectedMarkup() {
  const t=mktCopy(),n=heatScenarioValues();
  return `<span class="heat-result-label">${t.selectedProfit}</span><div class="heat-profit-row"><strong>${mktBdi(mktNumber(n.profit,2))}<small>${t.bn}</small></strong><span class="heat-profit-change ${n.delta<-.00001?'is-negative':n.delta>.00001?'is-positive':''}">${mktBdi(mktPercent(n.delta,true))}</span></div><p class="heat-baseline-profit">${mktFill(t.baselineProfit,{n:mktBdi(mktNumber(n.baselineProfit,2))})}</p><div class="heat-selection-pills"><span>${t.priceChange} ${mktBdi(mktPercent(n.price,true))}</span><span>${t.volumeChange} ${mktBdi(mktPercent(n.volume,true))}</span></div><div class="heat-detail-values"><div><small>${t.units}</small><b>${mktBdi(mktNumber(n.units,0))} <em>${t.unitLabel}</em></b></div><div><small>${t.unitPrice}</small><b>${mktBdi(mktNumber(n.unitPrice/1000))} <em>${t.thousand}</em></b></div><div><small>${t.unitMargin}</small><b>${mktBdi(mktNumber(n.unitMargin/1000))} <em>${t.thousand}</em></b></div><div><small>${t.netSales}</small><b>${mktBdi(mktNumber(n.netSales,2))} <em>${t.bn}</em></b></div></div>`;
}
function renderMarketHeatmap() {
  const t=mktCopy();
  return `<article class="simulator heat-scenario" id="heat-scenario" aria-labelledby="heat-title"><div class="heat-content">
    <div class="heat-heading"><span class="mkt-eyebrow">${t.heatDemo}</span><h3 id="heat-title">${t.heatTitle}</h3><p>${t.heatSubtitle}</p></div>
    <p class="heat-base">${t.heatBase}</p>
    <div class="heat-cost-field"><label for="heat-cost">${t.cost}<output id="heat-cost-value" for="heat-cost">${mktBdi(mktPercent(marketScenarioState.heatCostRatio))}</output></label><input id="heat-cost" type="range" min="40" max="85" step="5" value="${marketScenarioState.heatCostRatio}"><small id="heat-cost-amount">${mktFill(t.costAmount,{n:mktBdi(mktNumber(marketScenarioState.heatCostRatio*10))})}</small></div>
    <div class="heat-axis-title">${t.volumeAxis}</div><div class="heat-grid" id="heat-grid" role="group" aria-label="${t.heatTitle}">${heatGridMarkup()}</div>
    <div class="heat-legend"><span><i class="heat-legend-loss"></i>${t.lower}</span><span><i class="heat-legend-neutral"></i>${t.same}</span><span><i class="heat-legend-gain"></i>${t.higher}</span></div>
    <p class="heat-instruction">${t.heatInstruction}</p>
    <div class="heat-selected" id="heat-selected">${heatSelectedMarkup()}</div>
    <div class="heat-insight" id="heat-insight" role="status" aria-live="polite">${heatInsightMarkup()}</div>
    <div class="heat-bottom"><details class="mkt-assumptions"><summary>${t.heatSummary}</summary><p>${t.heatFormula}</p><p>${t.heatNote}</p></details><button type="button" class="mkt-reset" id="heat-reset">${t.heatReset}</button></div>
  </div></article>`;
}
function updateMarketHeatmap({restoreCellFocus=false}={}) {
  if(!document.getElementById('heat-scenario'))return;
  const t=mktCopy();
  document.getElementById('heat-cost-value').innerHTML=mktBdi(mktPercent(marketScenarioState.heatCostRatio));
  document.getElementById('heat-cost-amount').innerHTML=mktFill(t.costAmount,{n:mktBdi(mktNumber(marketScenarioState.heatCostRatio*10))});
  document.getElementById('heat-grid').innerHTML=heatGridMarkup();
  document.getElementById('heat-selected').innerHTML=heatSelectedMarkup();
  document.getElementById('heat-insight').innerHTML=heatInsightMarkup();
  if(restoreCellFocus)document.querySelector('#heat-grid .is-selected')?.focus({preventScroll:true});
}
function initMarketScenarios() {
  const market=document.getElementById('mkt-intelligence');
  if(market){
    ['growth','loss','recapture'].forEach(key=>{
      const input=document.getElementById('mkt-'+key);input.value=marketScenarioState[key];
      input.oninput=()=>{marketScenarioState[key]=Number(input.value);updateMarketIntelligence();};
    });
    document.getElementById('mkt-reset').onclick=()=>{
      Object.assign(marketScenarioState,{growth:10,loss:3,recapture:2});
      ['growth','loss','recapture'].forEach(key=>{document.getElementById('mkt-'+key).value=marketScenarioState[key];});updateMarketIntelligence();
    };
    mktRenderChart();updateMarketIntelligence();
  }
  const heat=document.getElementById('heat-scenario');
  if(heat){
    const cost=document.getElementById('heat-cost');cost.value=marketScenarioState.heatCostRatio;
    cost.oninput=()=>{marketScenarioState.heatCostRatio=Number(cost.value);updateMarketHeatmap();};
    document.getElementById('heat-grid').onclick=event=>{
      const cell=event.target.closest('[data-heat-price]');if(!cell)return;
      const price=Number(cell.dataset.heatPrice),volume=Number(cell.dataset.heatVolume);
      if(!heatPriceSteps.includes(price)||!heatVolumeSteps.includes(volume))return;
      marketScenarioState.heatPrice=price;marketScenarioState.heatVolume=volume;
      updateMarketHeatmap({restoreCellFocus:event.detail===0});
    };
    document.getElementById('heat-reset').onclick=()=>{Object.assign(marketScenarioState,{heatCostRatio:60,heatPrice:-5,heatVolume:10});cost.value=60;updateMarketHeatmap();};
    updateMarketHeatmap();
  }
}
function refreshMarketTheme() {
  if(typeof myChart==='undefined'||!myChart)return;
  const color=theme==='dark'?'#a1b1c4':'#475569';
  myChart.options.plugins.legend.labels.color=color;
  myChart.options.scales.x.ticks.color=color;myChart.options.scales.y.ticks.color=color;
  myChart.data.datasets[1].borderColor=theme==='dark'?'#b9c7d8':'#64748b';
  myChart.data.datasets[1].backgroundColor=myChart.data.datasets[1].borderColor;
  myChart.update();
}


// Bilingual executive wording is part of this document.
function textMarkup(key) {
  const tag=/^dom_\d_o\d$/.test(key)?'div':'span';
  return `<${tag} class="editable-copy">${dict[lang][key]}</${tag}>`;
}

function executiveNavigationItems() {
  return lang==='fa'
    ? [['overview','نگاه مدیریتی'],['sales-okr','اهداف فروش'],['priorities','اولویت‌ها'],['roadmap','نقشه راه'],['metrics','شاخص‌ها'],['governance','مرور عملکرد'],['decisions','تصمیم‌های کلیدی'],['simulators','سناریوها']]
    : [['overview','Overview'],['sales-okr','Sales OKRs'],['priorities','Priorities'],['roadmap','Roadmap'],['metrics','Measures'],['governance','Reviews'],['decisions','Key decisions'],['simulators','Scenarios']];
}

function updateExecutiveThemeControl() {
  const label=lang==='fa'
    ? (theme==='dark'?'فعال‌کردن حالت روشن':'فعال‌کردن حالت تیره')
    : (theme==='dark'?'Switch to light theme':'Switch to dark theme');
  const button=document.getElementById('themeBtn');
  button.setAttribute('aria-label',label);button.title=label;
}

function updateExecutiveChrome() {
  document.documentElement.lang=lang;
  document.documentElement.dir=lang==='fa'?'rtl':'ltr';
  document.body.dir=lang==='fa'?'rtl':'ltr';
  document.title=lang==='fa'?'از راهبرد تا نتیجه | اهداف و عملکرد':'From strategy to results | Executive goals & performance';
  const languageButton=document.getElementById('langBtn');
  languageButton.textContent=lang==='fa'?'English':'فارسی';
  languageButton.lang=lang==='fa'?'en':'fa';
  languageButton.setAttribute('aria-label',lang==='fa'?'Switch to English':'تغییر زبان به فارسی');
  const navigation=document.getElementById('headerNav');
  navigation.setAttribute('aria-label',lang==='fa'?'بخش‌های صفحه':'Page sections');
  navigation.innerHTML=`<div class="header-links">${executiveNavigationItems().map(([id,label])=>`<a class="header-link" href="#${id}" data-section="${id}">${label}</a>`).join('')}</div>`;
  updateExecutiveThemeControl();
  requestAnimationFrame(()=>{measureExecutiveHeader();updateExecutiveActiveSection();});
}

function executiveFooter() {
  return `<footer class="exec-footer"><span>${lang==='fa'?'چارچوب تصمیم‌گیری و نمونه هدف‌گذاری • داده‌های نمایشی':'Executive decision framework & sample target setting · Illustrative data'}</span><a href="#overview">${lang==='fa'?'بازگشت به ابتدای صفحه ↑':'Back to top ↑'}</a></footer>`;
}

let executiveScrollFrame=0;
function measureExecutiveHeader() {
  const header=document.querySelector('.executive-header');
  if(header) document.documentElement.style.setProperty('--exec-header-height',Math.ceil(header.getBoundingClientRect().height)+'px');
}

function updateExecutiveActiveSection() {
  const threshold=document.querySelector('.executive-header').getBoundingClientRect().bottom+54;
  const ids=executiveNavigationItems().map(([id])=>id);
  let activeId=ids[0];
  for(const id of ids) {
    const section=document.getElementById(id);
    if(section && section.getBoundingClientRect().top<=threshold) activeId=id;
  }
  if(window.innerHeight+window.scrollY>=document.documentElement.scrollHeight-8) activeId=ids[ids.length-1];
  document.querySelectorAll('.header-link').forEach(link=>{
    if(link.dataset.section===activeId) link.setAttribute('aria-current','location');
    else link.removeAttribute('aria-current');
  });
}

function queueExecutiveScrollUpdate() {
  if(executiveScrollFrame) return;
  executiveScrollFrame=requestAnimationFrame(()=>{executiveScrollFrame=0;updateExecutiveActiveSection();});
}

function scrollExecutiveSection(id, smooth=true) {
  const section=document.getElementById(id);if(!section)return;
  measureExecutiveHeader();
  const top=section.getBoundingClientRect().top+window.scrollY-document.querySelector('.executive-header').getBoundingClientRect().height-22;
  const reduce=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  window.scrollTo({top:Math.max(0,top),behavior:smooth&&!reduce?'smooth':'instant'});
}

document.getElementById('headerNav').addEventListener('click',event=>{
  const link=event.target.closest('a[data-section]');
  if(!link || event.ctrlKey || event.metaKey || event.shiftKey || event.altKey || event.button)return;
  event.preventDefault();
  const id=link.dataset.section;
  try {history.pushState(null,'','#'+id);} catch (_) { /* Scroll still works in file previews. */ }
  scrollExecutiveSection(id);
  if(event.detail===0) {
    const section=document.getElementById(id);section.setAttribute('tabindex','-1');section.focus({preventScroll:true});
  }
});
window.addEventListener('scroll',queueExecutiveScrollUpdate,{passive:true});
window.addEventListener('resize',()=>{measureExecutiveHeader();queueExecutiveScrollUpdate();},{passive:true});
window.addEventListener('popstate',()=>{
  const id=location.hash.slice(1);
  if(executiveNavigationItems().some(([sectionId])=>sectionId===id))scrollExecutiveSection(id);
});
if(typeof ResizeObserver!=='undefined') new ResizeObserver(()=>{measureExecutiveHeader();queueExecutiveScrollUpdate();}).observe(document.querySelector('.executive-header'));

document.getElementById('themeBtn').addEventListener('click',()=>{
  theme=theme==='dark'?'light':'dark';
  document.documentElement.setAttribute('data-theme',theme);
  updateExecutiveThemeControl();
  if(myChart && typeof Chart!=='undefined') {
    const color=theme==='dark'?'#a1b1c4':'#475569';
    Chart.defaults.color=color;
    myChart.options.plugins.legend.labels.color=color;
    myChart.options.scales.x.ticks.color=color;
    myChart.options.scales.y.ticks.color=color;
    myChart.update();
  }
  if(typeof refreshOkrTheme==='function')refreshOkrTheme();
  if(typeof refreshMarketTheme==='function')refreshMarketTheme();
});
document.getElementById('langBtn').addEventListener('click',()=>{
  lang=lang==='fa'?'en':'fa';
  renderContent();
});
window.addEventListener('DOMContentLoaded',()=>{
  renderContent();
  const id=location.hash.slice(1);
  if(executiveNavigationItems().some(([sectionId])=>sectionId===id))requestAnimationFrame(()=>scrollExecutiveSection(id,false));
  if(document.fonts) document.fonts.ready.then(()=>{
    measureExecutiveHeader();updateExecutiveActiveSection();
    if(myChart)myChart.update();
  });
});

  </script>
</body>
</html>
