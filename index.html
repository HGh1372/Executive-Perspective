<!DOCTYPE html>
<html lang="fa" dir="rtl" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>C-Suite Executive Blueprint | Strategy & Simulators</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Vazirmatn:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>
    :root {
      --font-fa: 'Vazirmatn', -apple-system, sans-serif;
      --font-en: 'Plus Jakarta Sans', -apple-system, sans-serif;
      --transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }

    [data-theme="dark"] {
      --bg-base: #040609; --bg-surface: #0b111a; --bg-card: #0d141e;
      --bg-result: rgba(14, 165, 233, 0.08); --border-subtle: rgba(255, 255, 255, 0.05);
      --border-accent: rgba(56, 189, 248, 0.4); --text-main: #f8fafc;
      --text-muted: #a1a1aa; --text-dim: #64748b; --primary: #0ea5e9;
      --primary-light: #38bdf8; --accent: #8b5cf6; --success: #10b981;
      --warning: #f59e0b; --danger: #ef4444; --shadow: 0 16px 40px rgba(0,0,0,0.5);
    }

    [data-theme="light"] {
      --bg-base: #f4f7fa; --bg-surface: #ffffff; --bg-card: #ffffff;
      --bg-result: rgba(2, 132, 199, 0.05); --border-subtle: rgba(0, 0, 0, 0.1);
      --border-accent: rgba(37, 99, 235, 0.3); --text-main: #0f172a;
      --text-muted: #475569; --text-dim: #94a3b8; --primary: #0284c7;
      --primary-light: #0ea5e9; --accent: #6d28d9; --success: #059669;
      --warning: #d97706; --danger: #dc2626; --shadow: 0 16px 40px rgba(0,0,0,0.06);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; scroll-behavior: smooth; }
    body { background-color: var(--bg-base); color: var(--text-main); font-family: var(--font-fa); line-height: 1.8; transition: background-color 0.4s, color 0.4s; overflow-x: hidden; }
    body[dir="ltr"] { font-family: var(--font-en); }

    /* Tooltip Styles */
    .tooltip { position: relative; border-bottom: 1px dotted var(--primary-light); cursor: help; color: inherit; font-weight: 700; transition: var(--transition); }
    .tooltip:hover { color: var(--primary-light); }
    .tooltip::after {
      content: attr(data-tooltip); position: absolute; bottom: 130%; left: 50%; transform: translateX(-50%) translateY(5px);
      background: var(--bg-surface); color: var(--text-main); padding: 0.4rem 0.8rem; border-radius: 6px;
      font-size: 0.75rem; white-space: nowrap; opacity: 0; visibility: hidden; transition: var(--transition);
      border: 1px solid var(--border-accent); box-shadow: 0 4px 15px rgba(0,0,0,0.2); z-index: 1000;
    }
    .tooltip:hover::after { opacity: 1; visibility: visible; transform: translateX(-50%) translateY(0); }

    /* Header */
    header { position: sticky; top: 0; z-index: 1000; background: var(--bg-surface); border-bottom: 1px solid var(--border-subtle); padding: 1rem 4%; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 4px 20px rgba(0,0,0,0.2); }
    .brand { font-weight: 800; font-size: 1.2rem; display: flex; align-items: center; gap: 0.5rem; }
    .brand span { color: var(--primary); }
    .controls { display: flex; gap: 1rem; align-items: center; }
    .btn { background: var(--bg-card); border: 1px solid var(--border-subtle); color: var(--text-main); padding: 0.4rem 1.2rem; border-radius: 20px; font-weight: 700; font-size: 0.8rem; cursor: pointer; transition: var(--transition); font-family: inherit; }
    .btn:hover { background: var(--primary); color: #fff; border-color: var(--primary); }
    .btn-edit { background: rgba(59, 130, 246, 0.15); color: var(--primary-light); border-color: rgba(59, 130, 246, 0.4); }
    .btn-edit:hover { background: var(--primary-light); color: #000; }

    /* Core Container */
    .container { max-width: 1400px; margin: 0 auto; padding: 3rem 4%; display: flex; flex-direction: column; gap: 5rem; transition: var(--transition); border-radius: 16px;}
    .sec-head { margin-bottom: 2.5rem; }
    .sec-head h2 { font-size: 2rem; font-weight: 800; display: flex; align-items: center; gap: 0.75rem; margin-bottom: 1rem; color: var(--primary-light); }
    .sec-head h2::before { content: ''; width: 6px; height: 2rem; background: var(--primary); border-radius: 4px; }
    .sec-head p { font-size: 1.05rem; color: var(--text-muted); max-width: 1100px; line-height: 1.8; text-align: justify; }

    /* Grids & Refined Cards (Based on Image Reference) */
    .grid-2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(450px, 1fr)); gap: 2rem; }
    .grid-3 { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 2rem; }
    
    .card { 
      background: var(--bg-card); border: 1px solid #1e3a5f; border-radius: 12px; 
      padding: 2rem; transition: var(--transition); display: flex; flex-direction: column; 
      height: 100%; position: relative;
    }
    .card:hover { border-color: var(--primary-light); box-shadow: 0 0 20px rgba(56, 189, 248, 0.05); transform: translateY(-3px); }
    
    .card-tag-wrapper { display: flex; justify-content: flex-end; margin-bottom: 1.5rem; }
    body[dir="ltr"] .card-tag-wrapper { justify-content: flex-end; }
    .card-tag { 
      display: inline-block; padding: 0.3rem 0.8rem; background: transparent; 
      color: var(--primary-light); font-weight: 700; font-size: 0.85rem; 
      border-radius: 6px; border: 1px solid #1e3a5f;
    }
    
    .en-title { display: block; text-align: right; font-size: 1.4rem; font-weight: 800; margin-bottom: 1.25rem; color: var(--primary-light); }
    body[dir="ltr"] .en-title { text-align: left; }
    
    .card-desc { font-size: 0.95rem; color: var(--text-muted); margin-bottom: 2rem; text-align: justify; line-height: 1.8; flex-grow: 1; }
    
    .card-list { display: flex; flex-direction: column; gap: 1rem; border-top: 1px dashed #1e3a5f; padding-top: 1.5rem; }
    .card-list-item { font-size: 0.9rem; color: var(--text-muted); display: flex; gap: 0.5rem; align-items: baseline; line-height: 1.7; }
    .card-list-item .diamond { color: var(--primary-light); font-size: 0.8rem; margin-top: 2px;}
    .lbl-bold { font-weight: 800; color: #ffffff; white-space: nowrap; }
    
    .doc-ref { background: rgba(139, 92, 246, 0.15); color: var(--accent); padding: 0.1rem 0.4rem; border-radius: 4px; font-weight: 700; border: 1px solid rgba(139, 92, 246, 0.3); font-size: 0.85rem; margin: 0 0.2rem; display: inline-block; direction: ltr; }

    /* Tables */
    .table-wrapper { overflow-x: auto; background: var(--bg-surface); border: 1px solid var(--border-subtle); border-radius: 16px; }
    table { width: 100%; border-collapse: collapse; text-align: inherit; }
    th { padding: 1.2rem; background: rgba(0,0,0,0.1); color: var(--text-dim); font-size: 0.9rem; font-weight: 800; border-bottom: 1px solid var(--border-subtle); }
    td { padding: 1.2rem; font-size: 0.95rem; color: var(--text-muted); border-bottom: 1px solid var(--border-subtle); }
    tr:hover td { background: var(--bg-result); color: var(--text-main); }

    /* Simulators */
    .sim-container { display: grid; grid-template-columns: repeat(auto-fit, minmax(500px, 1fr)); gap: 2.5rem; }
    .simulator { background: var(--bg-surface); border: 1px solid var(--border-subtle); border-radius: 20px; overflow: hidden; display: flex; flex-direction: column; box-shadow: 0 4px 20px rgba(0,0,0,0.15); }
    .sim-top-card { padding: 2rem; text-align: center; border-bottom: 1px solid var(--border-subtle); transition: var(--transition); display: flex; flex-direction: column; align-items: center; gap: 0.75rem; }
    .res-title { font-size: 0.85rem; font-weight: 800; color: var(--text-dim); text-transform: uppercase; letter-spacing: 1px; }
    
    /* RTL fixed for score */
    .res-score { display: flex; align-items: baseline; justify-content: center; gap: 0.5rem; }
    .res-score .num { font-size: 3rem; font-weight: 800; line-height: 1.2; direction: ltr; display: inline-block; }
    .res-score .unit { font-size: 1.2rem; font-weight: 600; color: var(--text-dim); }
    
    .res-verdict { font-size: 1.1rem; font-weight: 800; padding: 0.6rem 1.5rem; border-radius: 12px; transition: all 0.3s; width: 100%; max-width: 400px; text-align: center; }
    
    /* Sim Controls & Logic Panel */
    .sim-controls { padding: 2rem; display: flex; flex-direction: column; gap: 1.5rem; }
    .sim-header-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.5rem; }
    .sim-controls h4 { font-size: 1.2rem; font-weight: 800; color: var(--primary-light); }
    
    /* Logic Panel (Visible by default) */
    .sim-logic { display: block; background: rgba(255,255,255,0.03); padding: 1.25rem; border-radius: 12px; border-right: 3px solid var(--primary); margin-bottom: 1rem; font-size: 0.85rem; color: var(--text-muted); line-height: 1.8; text-align: justify;}
    body[dir="ltr"] .sim-logic { border-right: none; border-left: 3px solid var(--primary); }
    [data-theme="light"] .sim-logic { background: rgba(0,0,0,0.03); }
    .logic-title { color: var(--text-main); font-weight: 800; margin-bottom: 0.5rem; font-size: 0.95rem; display: flex; align-items: center; gap: 0.4rem;}
    .logic-link { color: var(--accent); text-decoration: none; font-weight: 700; }
    .logic-link:hover { text-decoration: underline; }

    /* Sliders */
    .slider-group { display: flex; flex-direction: column; gap: 0.5rem; }
    .slider-labels { display: flex; justify-content: space-between; font-size: 0.85rem; font-weight: 700; color: var(--text-muted); }
    .slider-labels span.val { color: var(--primary-light); font-weight: 800; font-size: 1.05rem; direction: ltr; display: inline-block; }
    input[type=range] { width: 100%; accent-color: var(--primary); cursor: pointer; height: 6px; }

    /* Chart Layout */
    .chart-layout { background: var(--bg-surface); border: 1px solid var(--border-subtle); border-radius: 20px; display: grid; grid-template-columns: 1fr 2fr; gap: 0; overflow: hidden; }
    .chart-controls { padding: 2rem; border-left: 1px solid var(--border-subtle); background: var(--bg-card); display: flex; flex-direction: column; gap: 1.5rem; }
    body[dir="ltr"] .chart-controls { border-left: none; border-right: 1px solid var(--border-subtle); }
    .chart-canvas-wrap { padding: 2rem; position: relative; min-height: 450px; }
    
    /* Specific Colors */
    .bg-safe { background: rgba(16,185,129,0.1); border-color: rgba(16,185,129,0.3); color: var(--success); }
    .text-safe { color: var(--success); }
    .bg-warn { background: rgba(245,158,11,0.1); border-color: rgba(245,158,11,0.3); color: var(--warning); }
    .text-warn { color: var(--warning); }
    .bg-danger { background: rgba(239,68,68,0.1); border-color: rgba(239,68,68,0.3); color: var(--danger); }
    .text-danger { color: var(--danger); }
    .bg-primary { background: rgba(59,130,246,0.1); border-color: rgba(59,130,246,0.3); color: var(--primary-light); }
    .text-accent { color: var(--accent); }
    .bg-accent { background: rgba(139,92,246,0.1); border-color: rgba(139,92,246,0.3); color: var(--accent); }

    /* Summary Card */
    .summary-card { background: linear-gradient(135deg, rgba(14,165,233,0.1), rgba(139,92,246,0.05)); border: 1px solid var(--border-accent); border-radius: 16px; padding: 3rem; text-align: right; box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
    body[dir="ltr"] .summary-card { text-align: left; }
    .summary-card h3 { font-size: 1.8rem; font-weight: 800; color: var(--primary-light); margin-bottom: 1.5rem; text-align: center; border-bottom: 1px solid rgba(14,165,233,0.2); padding-bottom: 1rem; }
    .manifesto-block { font-size:1.05rem; font-weight:500; color:var(--text-main); line-height:1.9; text-align: justify; }
    .manifesto-block strong { color:var(--primary-light); font-weight:800; }
    
    @media (max-width: 1024px) { .chart-layout { grid-template-columns: 1fr; } .chart-controls { border-left: none; border-bottom: 1px solid var(--border-subtle); } body[dir="ltr"] .chart-controls { border-right: none; } }
    @media (max-width: 768px) { .grid-2, .grid-3, .sim-container { grid-template-columns: 1fr; } .res-score .num { font-size: 2.2rem; } }
  </style>
</head>

            <div class="card" style="padding:1.5rem;"><p style="margin:0; font-weight:700;">${d.kpi_4}</p></div>
            <div class="card" style="padding:1.5rem;"><p style="margin:0; font-weight:700;">${d.kpi_5}</p></div>
            <div class="card" style="padding:1.5rem;"><p style="margin:0; font-weight:700;">${d.kpi_6}</p></div>
            <div class="card" style="padding:1.5rem; background:rgba(14,165,233,0.1); border-color:var(--primary);"><p style="margin:0; font-weight:800; color:var(--primary-light);">${d.kpi_7}</p></div>
          </div>
        </div>

        <div class="section">
          <div class="sec-head"><h2>${d.sec6_title}</h2><p>${d.sec6_desc}</p></div>
          <div class="table-wrapper">
            <table dir="${dir}">
              <thead><tr><th>${d.th_freq}</th><th>${d.th_focus}</th><th>${d.th_out}</th></tr></thead>
              <tbody>
                <tr><td><strong>${d.tr1_1}</strong></td><td>${d.tr1_2}</td><td>${d.tr1_3}</td></tr>
                <tr><td><strong>${d.tr2_1}</strong></td><td>${d.tr2_2}</td><td>${d.tr2_3}</td></tr>
                <tr><td><strong>${d.tr3_1}</strong></td><td>${d.tr3_2}</td><td>${d.tr3_3}</td></tr>
              </tbody>
            </table>
          </div>
        </div>

        <div class="section">
          <div class="summary-card">
            <h3>${d.sec7_title}</h3>
            <div class="manifesto-block">${d.sec7_desc}</div>
          </div>
        </div>

        <div class="section">
          <div class="sec-head"><h2>${d.sim_head}</h2><p>${d.sim_sub}</p></div>

          <!-- Chart Simulator -->
          <div class="chart-layout" style="margin-bottom: 3rem;">
            <div class="chart-controls">
              <div class="sim-top-card" style="padding: 1rem; border:none;">
                <div class="res-title">${d.ch_lbl}</div>
                <div class="res-verdict bg-primary" id="ch_verdict">${d.ch_v_opt}</div>
              </div>
              <div class="sim-header-row">
                <h4 style="font-weight:800; color:var(--primary-light);">${d.ch_title}</h4>
              </div>
              
              <div class="sim-logic">
                <div class="logic-title"><span style="font-size:1.1rem">${d.logic_icon}</span> ${d.logic_ch_t}</div>
                ${d.logic_ch_d}
              </div>
              
              <div class="slider-group">
                <label><span>${d.ch_sl1}</span> <span class="val" id="v_rwe" dir="ltr">x1.5</span></label>
                <input type="range" id="sl_rwe" min="1" max="3" step="0.1" value="1.5" oninput="updateChart()">
              </div>
              <div class="slider-group">
                <label><span>${d.ch_sl2}</span> <span class="val" id="v_price" dir="ltr">80%</span></label>
                <input type="range" id="sl_price" min="50" max="100" step="5" value="80" oninput="updateChart()">
              </div>
              <div class="slider-group">
                <label><span>${d.ch_sl3}</span> <span class="val" id="v_comp" dir="ltr">18</span></label>
                <input type="range" id="sl_comp" min="0" max="36" step="2" value="18" oninput="updateChart()">
              </div>
            </div>
            <div class="chart-canvas-wrap"><canvas id="marketChart"></canvas></div>
          </div>

          <!-- Component Simulators -->
          <div class="sim-container">
            <!-- BD Sim -->
            <div class="simulator">
              <div class="sim-top-card" id="card_bd">
                <div class="res-title">${d.bd_lbl}</div>
                <div class="res-score text-safe" id="val_bd">
                  <span class="num">8.0</span> <span class="unit">/ 10</span>
                </div>
                <div class="res-verdict bg-safe" id="dec_bd">${d.bd_pass}</div>
              </div>
              <div class="sim-controls">
                <div class="sim-header-row">
                  <h4>${d.bd_title}</h4>
                </div>
                <div class="sim-logic"><div class="logic-title"><span style="font-size:1.1rem">${d.logic_icon}</span> ${d.logic_bd_t}</div>${d.logic_bd_d}</div>
                
                <div class="slider-group"><label><span>${d.bd_sl1}</span> <span class="val" id="v_bd1" dir="ltr">8</span></label><input type="range" id="s_bd1" min="1" max="10" value="8" oninput="calcBD()"></div>
                <div class="slider-group"><label><span>${d.bd_sl2}</span> <span class="val" id="v_bd2" dir="ltr">7</span></label><input type="range" id="s_bd2" min="1" max="10" value="7" oninput="calcBD()"></div>
                <div class="slider-group"><label><span>${d.bd_sl3}</span> <span class="val" id="v_bd3" dir="ltr">9</span></label><input type="range" id="s_bd3" min="1" max="10" value="9" oninput="calcBD()"></div>
              </div>
            </div>

            <!-- PSP Sim -->
            <div class="simulator">
              <div class="sim-top-card bg-safe" id="card_psp" style="border-color:transparent;">
                <div class="res-title">${d.psp_lbl}</div>
                <div class="res-score text-safe" id="val_psp">
                   <span class="num" id="val_psp_num">9.00</span> <span class="unit">${d.toman}</span>
                </div>
                <div class="res-verdict bg-safe" id="dec_psp" style="border-color:transparent;">${d.psp_save.replace('{n}', '600')}</div>
              </div>
              <div class="sim-controls">
                <div class="sim-header-row">
                  <h4>${d.psp_title}</h4>
                </div>
                <div class="sim-logic"><div class="logic-title"><span style="font-size:1.1rem">${d.logic_icon}</span> ${d.logic_psp_t}</div>${d.logic_psp_d}</div>
                
                <div class="slider-group"><label><span>${d.psp_sl1}</span> <span class="val" id="v_psp1" dir="ltr">5000</span></label><input type="range" id="s_psp1" min="1000" max="10000" step="500" value="5000" oninput="calcPSP()"></div>
                <div class="slider-group"><label><span>${d.psp_sl2}</span> <span class="val" id="v_psp2" dir="ltr">30%</span></label><input type="range" id="s_psp2" min="10" max="60" step="5" value="30" oninput="calcPSP()"></div>
                <div class="slider-group"><label><span>${d.psp_sl3}</span> <span class="val" id="v_psp3" dir="ltr">40%</span></label><input type="range" id="s_psp3" min="10" max="80" step="5" value="40" oninput="calcPSP()"></div>
              </div>
            </div>

            <!-- PV Sim -->
            <div class="simulator">
              <div class="sim-top-card" style="background: rgba(239,68,68,0.08);" id="card_pv">
                <div class="res-title">${d.pv_lbl}</div>
                <div class="res-score text-danger" id="val_pv">
                  <span class="num" id="val_pv_num">1.35</span> <span class="unit" id="val_pv_unit">${d.toman}</span>
                </div>
                <div class="res-verdict bg-danger" id="dec_pv">${d.pv_crit}</div>
              </div>
              <div class="sim-controls">
                <div class="sim-header-row">
                  <h4>${d.pv_title}</h4>
                </div>
                <div class="sim-logic"><div class="logic-title"><span style="font-size:1.1rem">${d.logic_icon}</span> ${d.logic_pv_t}</div>${d.logic_pv_d}</div>
                
                <div class="slider-group"><label><span>${d.pv_sl1}</span> <span class="val" id="v_pv1" dir="ltr">15</span></label><input type="range" id="s_pv1" min="0" max="60" value="15" oninput="calcPV()"></div>
                <div class="slider-group"><label><span>${d.pv_sl2}</span> <span class="val" id="v_pv2" dir="ltr">3</span></label><input type="range" id="s_pv2" min="0" max="10" value="3" oninput="calcPV()"></div>
              </div>
            </div>

            <!-- Market Access Sim -->
            <div class="simulator">
              <div class="sim-top-card" style="background: rgba(139,92,246,0.08);" id="card_acc">
                <div class="res-title">${d.acc_lbl}</div>
                <div class="res-score text-accent" id="val_acc">
                  <span class="num" id="val_acc_num">85</span><span class="unit">%</span>
                </div>
                <div class="res-verdict bg-accent" id="dec_acc">${d.acc_win.replace('{m}', '6')}</div>
              </div>
              <div class="sim-controls">
                <div class="sim-header-row">
                  <h4>${d.acc_title}</h4>
                </div>
                <div class="sim-logic"><div class="logic-title"><span style="font-size:1.1rem">${d.logic_icon}</span> ${d.logic_acc_t}</div>${d.logic_acc_d}</div>
                
                <div class="slider-group"><label><span>${d.acc_sl1}</span> <span class="val" id="v_acc1" dir="ltr">${d.lvl_high}</span></label><input type="range" id="s_acc1" min="1" max="3" value="3" oninput="calcACC()"></div>
                <div class="slider-group"><label><span>${d.acc_sl2}</span> <span class="val" id="v_acc2" dir="ltr">8/10</span></label><input type="range" id="s_acc2" min="1" max="10" value="8" oninput="calcACC()"></div>
              </div>
            </div>

          </div>
        </div>
      `;
      
      document.getElementById('mainContent').innerHTML = html;
      
      if(lang === 'en') {
        document.querySelectorAll('.card').forEach(el => el.style.borderLeft = '1px solid #1e3a5f');
        document.querySelectorAll('.card').forEach(el => el.style.borderRight = '1px solid #1e3a5f');
      } else {
        document.querySelectorAll('.card').forEach(el => el.style.borderRight = '1px solid #1e3a5f');
        document.querySelectorAll('.card').forEach(el => el.style.borderLeft = '1px solid #1e3a5f');
      }

      initChart(); calcBD(); calcPSP(); calcPV(); calcACC();
    }

    // --- Simulator Logic ---
    function updateChart() {
      if(!myChart) return;
      const rwe = parseFloat(document.getElementById('sl_rwe').value);
      const price = parseFloat(document.getElementById('sl_price').value) / 100;
      const delay = parseInt(document.getElementById('sl_comp').value);

      document.getElementById('v_rwe').textContent = "x" + rwe;
      document.getElementById('v_price').textContent = (price * 100) + "%";
      document.getElementById('v_comp').textContent = delay + (lang==='fa' ? " ماه" : " Months");

      // Iran market adapted base revenue in Billion Tomans
      let baseRev = [50, 80, 120, 160, 200];
      let newRev = baseRev.map(v => v * (rwe * 0.8) * price);
      
      let erosion = [0, 0, 0, 0, 0];
      if (delay < 12) erosion = [0, 20, 40, 60, 80];
      else if (delay < 24) erosion = [0, 0, 20, 40, 60];
      else if (delay < 36) erosion = [0, 0, 0, 20, 40];
      else erosion = [0, 0, 0, 0, 20];

      let adjustedErosion = erosion.map(v => v / (rwe * 0.8));

      myChart.data.datasets[0].data = newRev;
      myChart.data.datasets[1].data = adjustedErosion;
      myChart.update();

      const diff = newRev[2] - adjustedErosion[2];
      const verdictEl = document.getElementById('ch_verdict');
      if (diff > 50) {
        verdictEl.textContent = dict[lang].ch_v_opt;
        verdictEl.className = "res-verdict bg-primary";
      } else {
        verdictEl.textContent = dict[lang].ch_v_warn;
        verdictEl.className = "res-verdict bg-warn";
      }
    }

    function initChart() {
      const ctx = document.getElementById('marketChart');
      if(!ctx) return;
      if(myChart) myChart.destroy();
      
      Chart.defaults.color = theme === 'dark' ? '#94a3b8' : '#6b7280';
      Chart.defaults.font.family = lang === 'fa' ? 'Vazirmatn' : 'Plus Jakarta Sans';

      myChart = new Chart(ctx.getContext('2d'), {
        type: 'line',
        data: {
          labels: ['Year 1', 'Year 2', 'Year 3', 'Year 4', 'Year 5'],
          datasets: [
            { label: lang === 'fa' ? 'درآمد (میلیارد تومان)' : 'Revenue (Billion Tomans)', data: [], borderColor: '#3b82f6', backgroundColor: 'rgba(59,130,246,0.1)', borderWidth: 3, tension: 0.4, fill: true },
            { label: lang === 'fa' ? 'ریسک فرسایش (میلیارد تومان)' : 'Erosion Risk (Billion Tomans)', data: [], borderColor: '#ef4444', borderDash: [5, 5], borderWidth: 2, tension: 0.4, fill: false }
          ]
        },
        options: { responsive: true, maintainAspectRatio: false, scales: { y: { beginAtZero: true, grid: { color: 'rgba(200,200,200,0.1)' } }, x: { grid: { display: false } } } }
      });
      updateChart();
    }

    function calcBD() {
      const v1 = parseFloat(document.getElementById('s_bd1').value);
      const v2 = parseFloat(document.getElementById('s_bd2').value);
      const v3 = parseFloat(document.getElementById('s_bd3').value);
      document.getElementById('v_bd1').textContent = v1;
      document.getElementById('v_bd2').textContent = v2;
      document.getElementById('v_bd3').textContent = v3;

      const score = ((v1 * 0.4) + (v2 * 0.3) + (v3 * 0.3)).toFixed(1);
      const decEl = document.getElementById('dec_bd');
      const cardEl = document.getElementById('card_bd');
      
      document.getElementById('val_bd').innerHTML = `<span class="num">${score}</span> <span class="unit">/ 10</span>`;
      
      if (score >= 7.5) { decEl.textContent = dict[lang].bd_pass; decEl.className = "res-verdict bg-safe"; document.getElementById('val_bd').className = "res-score text-safe"; cardEl.style.backgroundColor = "rgba(16,185,129,0.08)"; }
      else if (score >= 6.0) { decEl.textContent = dict[lang].bd_warn; decEl.className = "res-verdict bg-warn"; document.getElementById('val_bd').className = "res-score text-warn"; cardEl.style.backgroundColor = "rgba(245,158,11,0.08)"; }
      else { decEl.textContent = dict[lang].bd_fail; decEl.className = "res-verdict bg-danger"; document.getElementById('val_bd').className = "res-score text-danger"; cardEl.style.backgroundColor = "rgba(239,68,68,0.08)"; }
    }

    function calcPSP() {
      const pop = parseInt(document.getElementById('s_psp1').value);
      const drop = parseInt(document.getElementById('s_psp2').value) / 100;
      const eff = parseInt(document.getElementById('s_psp3').value) / 100;
      document.getElementById('v_psp1').textContent = pop;
      document.getElementById('v_psp2').textContent = (drop * 100) + "%";
      document.getElementById('v_psp3').textContent = (eff * 100) + "%";

      const saved = Math.round(pop * drop * eff);
      // Avg treatment course value in Iran: e.g. 15 Million Tomans -> 15 / 1000 = 0.015 Billion Tomans
      const valueBillion = (saved * 15) / 1000; 

      document.getElementById('val_psp_num').textContent = valueBillion.toFixed(2);
      document.getElementById('dec_psp').textContent = dict[lang].psp_save.replace('{n}', saved);
    }

    function calcPV() {
      const delay = parseInt(document.getElementById('s_pv1').value);
      const capa = parseInt(document.getElementById('s_pv2').value);
      document.getElementById('v_pv1').textContent = delay;
      document.getElementById('v_pv2').textContent = capa;

      // Risk value: 50 Million Tomans per day delay + 200 Million Tomans per open CAPA
      const fineMillions = (delay * 50) + (capa * 200); 
      const fineBillions = fineMillions / 1000;
      
      const num = document.getElementById('val_pv_num');
      const unit = document.getElementById('val_pv_unit');
      const dec = document.getElementById('dec_pv');
      const card = document.getElementById('card_pv');

      if (fineMillions === 0) {
        num.textContent = "0"; unit.style.display = "none"; document.getElementById('val_pv').className = "res-score text-safe";
        dec.textContent = dict[lang].pv_safe; dec.className = "res-verdict bg-safe";
        card.style.backgroundColor = "rgba(16,185,129,0.08)";
      } else {
        num.textContent = fineBillions.toFixed(2); unit.style.display = "inline-block"; document.getElementById('val_pv').className = "res-score text-danger";
        dec.textContent = dict[lang].pv_crit; dec.className = "res-verdict bg-danger";
        card.style.backgroundColor = "rgba(239,68,68,0.08)";
      }
    }

    function calcACC() {
      const rwe = parseInt(document.getElementById('s_acc1').value);
      const kol = parseInt(document.getElementById('s_acc2').value);
      
      let lvlStr = rwe === 1 ? dict[lang].lvl_low : (rwe === 2 ? dict[lang].lvl_med : dict[lang].lvl_high);
      document.getElementById('v_acc1').textContent = lvlStr;
      document.getElementById('v_acc2').textContent = kol + "/10";

      const prob = Math.min(100, (rwe * 20) + (kol * 4)); 
      const speedUp = Math.round((prob / 100) * 8); 

      document.getElementById('val_acc_num').textContent = prob;
      document.getElementById('dec_acc').textContent = dict[lang].acc_win.replace('{m}', speedUp);
    }

    // --- Editor Logic ---
    document.getElementById('editBtn').addEventListener('click', (e) => {
      isEditMode = !isEditMode;
      const mainContent = document.getElementById('mainContent');
      if (isEditMode) {
        mainContent.contentEditable = "true";
        mainContent.style.border = "2px dashed var(--primary)";
        mainContent.style.padding = "2rem";
        e.target.textContent = dict[lang].btn_save;
        e.target.style.backgroundColor = "var(--success)";
        e.target.style.borderColor = "var(--success)";
        e.target.style.color = "#fff";
      } else {
        mainContent.contentEditable = "false";
        mainContent.style.border = "none";
        mainContent.style.padding = "3rem 4%";
        e.target.textContent = dict[lang].btn_edit;
        e.target.style.backgroundColor = "";
        e.target.style.borderColor = "";
        e.target.style.color = "";
      }
    });

    // --- Toggles ---
    document.getElementById('themeBtn').addEventListener('click', () => {
      theme = theme === 'dark' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', theme);
      if(myChart) { Chart.defaults.color = theme === 'dark' ? '#94a3b8' : '#6b7280'; myChart.update(); }
    });

    document.getElementById('langBtn').addEventListener('click', () => {
      lang = lang === 'fa' ? 'en' : 'fa';
      document.documentElement.lang = lang;
      document.documentElement.dir = lang === 'fa' ? 'rtl' : 'ltr';
      document.body.dir = lang === 'fa' ? 'rtl' : 'ltr';
      const editBtn = document.getElementById('editBtn');
      if(isEditMode) {
        editBtn.textContent = dict[lang].btn_save;
      } else {
        editBtn.textContent = dict[lang].btn_edit;
      }
      renderContent();
    });

    // Init
    window.onload = renderContent;
  </script>
</body>
</html>
