<!DOCTYPE html>
<html lang="fa" dir="rtl" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>C-Suite Executive Blueprint | Strategy & Simulators (IR Market)</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Vazirmatn:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>
    :root {
      --font-fa: 'Vazirmatn', -apple-system, sans-serif;
      --font-en: 'Plus Jakarta Sans', -apple-system, sans-serif;
      --transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }

    [data-theme="dark"] {
      --bg-base: #06090f; --bg-surface: #0d131f; --bg-card: rgba(18, 27, 43, 0.6);
      --bg-result: rgba(14, 165, 233, 0.08); --border-subtle: rgba(255, 255, 255, 0.1);
      --border-accent: rgba(14, 165, 233, 0.3); --text-main: #f8fafc;
      --text-muted: #94a3b8; --text-dim: #64748b; --primary: #0ea5e9;
      --primary-light: #38bdf8; --accent: #8b5cf6; --success: #10b981;
      --warning: #f59e0b; --danger: #ef4444; --shadow: 0 16px 40px rgba(0,0,0,0.5);
    }

    [data-theme="light"] {
      --bg-base: #f4f7fa; --bg-surface: #ffffff; --bg-card: #ffffff;
      --bg-result: rgba(2, 132, 199, 0.05); --border-subtle: rgba(0, 0, 0, 0.1);
      --border-accent: rgba(37, 99, 235, 0.3); --text-main: #0f172a;
      --text-muted: #475569; --text-dim: #94a3b8; --primary: #0284c7;
      --primary-light: #0ea5e9; --accent: #6d28d9; --success: #059669;
      --warning: #d97706; --danger: #dc2626; --shadow: 0 16px 40px rgba(0,0,0,0.06);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; scroll-behavior: smooth; }
    body { background-color: var(--bg-base); color: var(--text-main); font-family: var(--font-fa); line-height: 1.75; transition: background-color 0.4s, color 0.4s; overflow-x: hidden; }
    body[dir="ltr"] { font-family: var(--font-en); }

    /* Tooltip Styles */
    .tooltip { position: relative; border-bottom: 1px dotted var(--primary-light); cursor: help; color: inherit; font-weight: 700; transition: var(--transition); }
    .tooltip:hover { color: var(--primary-light); }
    .tooltip::after {
      content: attr(data-tooltip); position: absolute; bottom: 130%; left: 50%; transform: translateX(-50%) translateY(5px);
      background: var(--bg-surface); color: var(--text-main); padding: 0.3rem 0.6rem; border-radius: 6px;
      font-size: 0.75rem; white-space: nowrap; opacity: 0; visibility: hidden; transition: var(--transition);
      border: 1px solid var(--border-accent); box-shadow: 0 4px 15px rgba(0,0,0,0.2); z-index: 1000;
    }
    .tooltip:hover::after { opacity: 1; visibility: visible; transform: translateX(-50%) translateY(0); }

    /* Header */
    header { position: sticky; top: 0; z-index: 1000; background: var(--bg-surface); border-bottom: 1px solid var(--border-subtle); padding: 1rem 4%; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 4px 20px rgba(0,0,0,0.1); }
    .brand { font-weight: 800; font-size: 1.2rem; display: flex; align-items: center; gap: 0.5rem; }
    .brand span { color: var(--primary); }
    .controls { display: flex; gap: 1rem; }
    .btn { background: var(--bg-card); border: 1px solid var(--border-subtle); color: var(--text-main); padding: 0.4rem 1.2rem; border-radius: 20px; font-weight: 700; font-size: 0.8rem; cursor: pointer; transition: var(--transition); font-family: inherit; }
    .btn:hover { background: var(--primary); color: #fff; border-color: var(--primary); }

    /* Core Container */
    .container { max-width: 1400px; margin: 0 auto; padding: 3rem 4%; display: flex; flex-direction: column; gap: 5rem; }
    .sec-head { margin-bottom: 2.5rem; }
    .sec-head h2 { font-size: 2rem; font-weight: 800; display: flex; align-items: center; gap: 0.75rem; margin-bottom: 1rem; color: var(--primary-light); }
    .sec-head h2::before { content: ''; width: 6px; height: 2rem; background: var(--primary); border-radius: 4px; }
    .sec-head p { font-size: 1.05rem; color: var(--text-muted); max-width: 1100px; line-height: 1.8; }

    /* Grids & Cards */
    .grid-2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(450px, 1fr)); gap: 2rem; }
    .grid-3 { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 2rem; }
    .card { background: var(--bg-card); border: 1px solid var(--border-subtle); border-radius: 16px; padding: 2rem; transition: var(--transition); display: flex; flex-direction: column; height: 100%; box-shadow: 0 4px 20px rgba(0,0,0,0.05); }
    .card:hover { border-color: var(--border-accent); box-shadow: var(--shadow); transform: translateY(-3px); }
    .card h3 { font-size: 1.3rem; font-weight: 800; margin-bottom: 1rem; color: var(--primary-light); }
    .doc-ref { background: rgba(139, 92, 246, 0.15); color: var(--accent); padding: 0.1rem 0.4rem; border-radius: 4px; font-weight: 700; border: 1px solid rgba(139, 92, 246, 0.3); font-size: 0.85rem; margin: 0 0.1rem; white-space: nowrap; }

    /* Tables */
    .table-wrapper { overflow-x: auto; background: var(--bg-surface); border: 1px solid var(--border-subtle); border-radius: 16px; }
    table { width: 100%; border-collapse: collapse; text-align: inherit; }
    th { padding: 1.2rem; background: rgba(0,0,0,0.1); color: var(--text-dim); font-size: 0.9rem; font-weight: 800; border-bottom: 1px solid var(--border-subtle); }
    td { padding: 1.2rem; font-size: 0.95rem; color: var(--text-muted); border-bottom: 1px solid var(--border-subtle); }
    tr:hover td { background: var(--bg-result); color: var(--text-main); }

    /* Simulators */
    .sim-container { display: grid; grid-template-columns: repeat(auto-fit, minmax(500px, 1fr)); gap: 2.5rem; }
    .simulator { background: var(--bg-surface); border: 1px solid var(--border-subtle); border-radius: 20px; overflow: hidden; display: flex; flex-direction: column; box-shadow: 0 4px 20px rgba(0,0,0,0.15); }
    .sim-top-card { padding: 2rem; text-align: center; border-bottom: 1px solid var(--border-subtle); transition: var(--transition); display: flex; flex-direction: column; align-items: center; gap: 0.75rem; }
    .res-title { font-size: 0.85rem; font-weight: 800; color: var(--text-dim); text-transform: uppercase; letter-spacing: 1px; }
    .res-score { font-size: 3rem; font-weight: 800; line-height: 1.2; direction: ltr;}
    .res-verdict { font-size: 1.1rem; font-weight: 800; padding: 0.6rem 1.5rem; border-radius: 12px; transition: all 0.3s; width: 100%; max-width: 400px; }
    
    /* Sim Controls & Info Button */
    .sim-controls { padding: 2rem; display: flex; flex-direction: column; gap: 1.5rem; position: relative; }
    .sim-header-row { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 0.5rem; }
    .sim-controls h4 { font-size: 1.15rem; font-weight: 800; }
    .info-btn { background: rgba(59, 130, 246, 0.1); color: var(--primary-light); border: 1px solid rgba(59, 130, 246, 0.3); padding: 0.25rem 0.75rem; border-radius: 20px; font-size: 0.75rem; font-weight: 700; cursor: pointer; transition: 0.2s; font-family: inherit; }
    .info-btn:hover { background: var(--primary); color: #fff; }
    
    /* Expandable Scientific Logic Panel */
    .sim-logic { display: none; background: var(--bg-card); padding: 1.5rem; border-radius: 12px; border: 1px solid var(--border-accent); margin-bottom: 1rem; font-size: 0.85rem; color: var(--text-muted); line-height: 1.7; }
    .sim-logic.active { display: block; animation: fadeIn 0.4s ease; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(-5px); } to { opacity: 1; transform: translateY(0); } }
    .logic-title { color: var(--primary-light); font-weight: 800; margin-bottom: 0.5rem; font-size: 0.95rem; }
    .logic-link { color: var(--accent); text-decoration: none; font-weight: 700; }
    .logic-link:hover { text-decoration: underline; }

    /* Sliders */
    .slider-group { display: flex; flex-direction: column; gap: 0.5rem; }
    .slider-labels { display: flex; justify-content: space-between; font-size: 0.85rem; font-weight: 700; color: var(--text-muted); }
    .slider-labels span.val { color: var(--primary-light); font-weight: 800; font-size: 1rem; direction: ltr;}
    input[type=range] { width: 100%; accent-color: var(--primary); cursor: pointer; height: 6px; }

    /* Chart Layout */
    .chart-layout { background: var(--bg-surface); border: 1px solid var(--border-subtle); border-radius: 20px; display: grid; grid-template-columns: 1fr 2fr; gap: 0; overflow: hidden; }
    .chart-controls { padding: 2rem; border-left: 1px solid var(--border-subtle); background: var(--bg-card); display: flex; flex-direction: column; gap: 1.5rem; }
    body[dir="ltr"] .chart-controls { border-left: none; border-right: 1px solid var(--border-subtle); }
    .chart-canvas-wrap { padding: 2rem; position: relative; min-height: 450px; }
    
    /* Specific Colors */
    .bg-safe { background: rgba(16,185,129,0.1); border-color: rgba(16,185,129,0.3); color: var(--success); }
    .text-safe { color: var(--success); }
    .bg-warn { background: rgba(245,158,11,0.1); border-color: rgba(245,158,11,0.3); color: var(--warning); }
    .text-warn { color: var(--warning); }
    .bg-danger { background: rgba(239,68,68,0.1); border-color: rgba(239,68,68,0.3); color: var(--danger); }
    .text-danger { color: var(--danger); }
    .bg-primary { background: rgba(59,130,246,0.1); border-color: rgba(59,130,246,0.3); color: var(--primary-light); }
    .text-accent { color: var(--accent); }
    .bg-accent { background: rgba(139,92,246,0.1); border-color: rgba(139,92,246,0.3); color: var(--accent); }

    /* Summary Card */
    .summary-card { background: linear-gradient(135deg, rgba(14,165,233,0.1), rgba(139,92,246,0.05)); border: 1px solid var(--border-accent); border-radius: 16px; padding: 3rem; text-align: right; }
    body[dir="ltr"] .summary-card { text-align: left; }
    .summary-card h3 { font-size: 1.8rem; font-weight: 800; color: var(--primary-light); margin-bottom: 1.5rem; text-align: center; }
    .manifesto-block { font-size:1.05rem; font-weight:500; color:var(--text-main); line-height:1.8; text-align: justify; }
    .manifesto-block strong { color:var(--primary-light); font-weight:800; font-size: 1.15rem; display: block; margin-bottom: 0.5rem; margin-top: 1.5rem; }
    
    @media (max-width: 1024px) { .chart-layout { grid-template-columns: 1fr; } .chart-controls { border-left: none; border-bottom: 1px solid var(--border-subtle); } body[dir="ltr"] .chart-controls { border-right: none; } }
    @media (max-width: 768px) { .grid-2, .grid-3, .sim-container { grid-template-columns: 1fr; } .res-score { font-size: 2.2rem; } }
  </style>
</head>

                </div>
                <div id="info_acc" class="sim-logic"><div class="logic-title">${d.logic_acc_t}</div>${d.logic_acc_d}</div>
                <div class="slider-group"><label><span>${d.acc_sl1}</span> <span class="val" id="v_acc1" dir="ltr">${d.lvl_high}</span></label><input type="range" id="s_acc1" min="1" max="3" value="3" oninput="calcACC()"></div>
                <div class="slider-group"><label><span>${d.acc_sl2}</span> <span class="val" id="v_acc2" dir="ltr">8/10</span></label><input type="range" id="s_acc2" min="1" max="10" value="8" oninput="calcACC()"></div>
              </div>
            </div>

          </div>
        </div>
      `;
      
      document.getElementById('mainContent').innerHTML = html;
      
      if(lang === 'en') {
        document.querySelectorAll('.card').forEach(el => el.style.borderLeft = '4px solid var(--primary)');
        document.querySelectorAll('.card').forEach(el => el.style.borderRight = '1px solid var(--border-subtle)');
      } else {
        document.querySelectorAll('.card').forEach(el => el.style.borderRight = '4px solid var(--primary)');
        document.querySelectorAll('.card').forEach(el => el.style.borderLeft = '1px solid var(--border-subtle)');
      }

      initChart(); calcBD(); calcPSP(); calcPV(); calcACC();
    }

    // --- Simulator Logic ---
    function updateChart() {
      if(!myChart) return;
      const rwe = parseFloat(document.getElementById('sl_rwe').value);
      const price = parseFloat(document.getElementById('sl_price').value) / 100;
      const delay = parseInt(document.getElementById('sl_comp').value);

      document.getElementById('v_rwe').textContent = "x" + rwe;
      document.getElementById('v_price').textContent = (price * 100) + "%";
      document.getElementById('v_comp').textContent = delay + (lang==='fa' ? " ماه" : " Months");

      // Iran market adapted base revenue in Billion Tomans (میلیارد تومان)
      let baseRev = [50, 80, 120, 160, 200];
      let newRev = baseRev.map(v => v * (rwe * 0.8) * price);
      
      let erosion = [0, 0, 0, 0, 0];
      if (delay < 12) erosion = [0, 20, 40, 60, 80];
      else if (delay < 24) erosion = [0, 0, 20, 40, 60];
      else if (delay < 36) erosion = [0, 0, 0, 20, 40];
      else erosion = [0, 0, 0, 0, 20];

      let adjustedErosion = erosion.map(v => v / (rwe * 0.8));

      myChart.data.datasets[0].data = newRev;
      myChart.data.datasets[1].data = adjustedErosion;
      myChart.update();

      const diff = newRev[2] - adjustedErosion[2];
      const verdictEl = document.getElementById('ch_verdict');
      if (diff > 50) {
        verdictEl.textContent = dict[lang].ch_v_opt;
        verdictEl.className = "res-verdict bg-primary";
      } else {
        verdictEl.textContent = dict[lang].ch_v_warn;
        verdictEl.className = "res-verdict bg-warn";
      }
    }

    function initChart() {
      const ctx = document.getElementById('marketChart');
      if(!ctx) return;
      if(myChart) myChart.destroy();
      
      Chart.defaults.color = theme === 'dark' ? '#94a3b8' : '#6b7280';
      Chart.defaults.font.family = lang === 'fa' ? 'Vazirmatn' : 'Plus Jakarta Sans';

      myChart = new Chart(ctx.getContext('2d'), {
        type: 'line',
        data: {
          labels: ['Year 1', 'Year 2', 'Year 3', 'Year 4', 'Year 5'],
          datasets: [
            { label: lang === 'fa' ? 'درآمد (میلیارد تومان)' : 'Revenue (Billion Tomans)', data: [], borderColor: '#3b82f6', backgroundColor: 'rgba(59,130,246,0.1)', borderWidth: 3, tension: 0.4, fill: true },
            { label: lang === 'fa' ? 'ریسک فرسایش (میلیارد تومان)' : 'Erosion Risk (Billion Tomans)', data: [], borderColor: '#ef4444', borderDash: [5, 5], borderWidth: 2, tension: 0.4, fill: false }
          ]
        },
        options: { responsive: true, maintainAspectRatio: false, scales: { y: { beginAtZero: true, grid: { color: 'rgba(200,200,200,0.1)' } }, x: { grid: { display: false } } } }
      });
      updateChart();
    }

    function calcBD() {
      const v1 = parseFloat(document.getElementById('s_bd1').value);
      const v2 = parseFloat(document.getElementById('s_bd2').value);
      const v3 = parseFloat(document.getElementById('s_bd3').value);
      document.getElementById('v_bd1').textContent = v1;
      document.getElementById('v_bd2').textContent = v2;
      document.getElementById('v_bd3').textContent = v3;

      const score = ((v1 * 0.4) + (v2 * 0.3) + (v3 * 0.3)).toFixed(1);
      const valEl = document.getElementById('val_bd');
      const decEl = document.getElementById('dec_bd');
      const cardEl = document.getElementById('card_bd');
      
      valEl.textContent = score + " / 10";
      if (score >= 7.5) { decEl.textContent = dict[lang].bd_pass; decEl.className = "res-verdict bg-safe"; valEl.className = "res-score text-safe"; cardEl.style.backgroundColor = "rgba(16,185,129,0.08)"; }
      else if (score >= 6.0) { decEl.textContent = dict[lang].bd_warn; decEl.className = "res-verdict bg-warn"; valEl.className = "res-score text-warn"; cardEl.style.backgroundColor = "rgba(245,158,11,0.08)"; }
      else { decEl.textContent = dict[lang].bd_fail; decEl.className = "res-verdict bg-danger"; valEl.className = "res-score text-danger"; cardEl.style.backgroundColor = "rgba(239,68,68,0.08)"; }
    }

    function calcPSP() {
      const pop = parseInt(document.getElementById('s_psp1').value);
      const drop = parseInt(document.getElementById('s_psp2').value) / 100;
      const eff = parseInt(document.getElementById('s_psp3').value) / 100;
      document.getElementById('v_psp1').textContent = pop;
      document.getElementById('v_psp2').textContent = (drop * 100) + "%";
      document.getElementById('v_psp3').textContent = (eff * 100) + "%";

      const saved = Math.round(pop * drop * eff);
      // Avg treatment course value in Iran: e.g. 15 Million Tomans -> 15 / 1000 = 0.015 Billion Tomans
      const valueBillion = (saved * 15) / 1000; 

      document.getElementById('val_psp').textContent = valueBillion.toFixed(2) + " " + dict[lang].toman;
      document.getElementById('dec_psp').textContent = dict[lang].psp_save.replace('{n}', saved);
    }

    function calcPV() {
      const delay = parseInt(document.getElementById('s_pv1').value);
      const capa = parseInt(document.getElementById('s_pv2').value);
      document.getElementById('v_pv1').textContent = delay;
      document.getElementById('v_pv2').textContent = capa;

      // Risk value: 50 Million Tomans per day delay + 200 Million Tomans per open CAPA
      const fineMillions = (delay * 50) + (capa * 200); 
      const fineBillions = fineMillions / 1000;
      
      const val = document.getElementById('val_pv');
      const dec = document.getElementById('dec_pv');
      const card = document.getElementById('card_pv');

      if (fineMillions === 0) {
        val.textContent = "0"; val.className = "res-score text-safe";
        dec.textContent = dict[lang].pv_safe; dec.className = "res-verdict bg-safe";
        card.style.backgroundColor = "rgba(16,185,129,0.08)";
      } else {
        val.textContent = fineBillions.toFixed(2) + " " + dict[lang].toman; val.className = "res-score text-danger";
        dec.textContent = dict[lang].pv_crit; dec.className = "res-verdict bg-danger";
        card.style.backgroundColor = "rgba(239,68,68,0.08)";
      }
    }

    function calcACC() {
      const rwe = parseInt(document.getElementById('s_acc1').value);
      const kol = parseInt(document.getElementById('s_acc2').value);
      
      let lvlStr = rwe === 1 ? dict[lang].lvl_low : (rwe === 2 ? dict[lang].lvl_med : dict[lang].lvl_high);
      document.getElementById('v_acc1').textContent = lvlStr;
      document.getElementById('v_acc2').textContent = kol + "/10";

      const prob = Math.min(100, (rwe * 20) + (kol * 4)); 
      const speedUp = Math.round((prob / 100) * 8); 

      document.getElementById('val_acc').textContent = prob + "%";
      document.getElementById('dec_acc').textContent = dict[lang].acc_win.replace('{m}', speedUp);
    }

    // --- Toggles ---
    document.getElementById('themeBtn').addEventListener('click', () => {
      theme = theme === 'dark' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', theme);
      if(myChart) { Chart.defaults.color = theme === 'dark' ? '#94a3b8' : '#6b7280'; myChart.update(); }
    });

    document.getElementById('langBtn').addEventListener('click', () => {
      lang = lang === 'fa' ? 'en' : 'fa';
      document.documentElement.lang = lang;
      document.documentElement.dir = lang === 'fa' ? 'rtl' : 'ltr';
      document.body.dir = lang === 'fa' ? 'rtl' : 'ltr';
      renderContent();
    });

    // Init
    window.onload = renderContent;
  </script>
</body>
</html>
